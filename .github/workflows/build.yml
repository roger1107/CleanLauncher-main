name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-33 build-tools;36.0.0"

      - name: Tests
        run: sh test.sh

      - name: Build
        env:
          BUILD_TOOLS: "36.0.0"
          # Optional fixed signing key, so each CI APK can update the previous one instead of
          # needing an uninstall. Repo secrets: KEYSTORE_BASE64 (the .keystore, base64), KEYSTORE_PASS
          # and KEY_ALIAS. Without them (or on pull requests from forks) the debug key is used.
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export KEYSTORE="$RUNNER_TEMP/release.keystore"
          fi
          sh build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: CleanLauncher-${{ github.sha }}
          path: build/CleanLauncher.apk
          if-no-files-found: error
